name: Publish geokube package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: publish only if both test blocks pass.
  unit-tests:
    uses: ./.github/workflows/_test.yml
    with:
      markers: "not integration"
    secrets: inherit

  integration-tests:
    needs: unit-tests
    uses: ./.github/workflows/_test.yml
    with:
      markers: "integration"
    secrets: inherit

  build-and-publish:
    name: Build geokube package and publish to PyPI
    needs: integration-tests
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
