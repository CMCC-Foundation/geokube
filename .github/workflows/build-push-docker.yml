name: Build & push geokube image

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - 'geokube/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - 'geokube/**'
      - 'tests/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: the image is built/pushed only if both test blocks pass.
  unit-tests:
    uses: ./.github/workflows/_test.yml
    with:
      markers: "not integration"
    secrets: inherit

  integration-tests:
    needs: unit-tests
    uses: ./.github/workflows/_test.yml
    with:
      markers: "integration"
    secrets: inherit

  build:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_REGISTRY }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve base image digest (reproducible build)
        id: base
        run: |
          ref="${{ vars.DOCKER_REGISTRY }}/geokube-base:latest"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "image=${{ vars.DOCKER_REGISTRY }}/geokube-base@${digest}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/geokube
          # Apply :latest only on main (gates metadata-action's implicit latest=auto,
          # which would otherwise also tag :latest on release-tag builds).
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
          tags: |
            # PRs -> unique per commit, so Kubernetes always rolls out the new
            # dev image. A floating pr-<n> tag would keep the same name across
            # builds and many pods would never re-pull the updated digest.
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            # Everything except PRs -> traceable sha tag (also covers workflow_dispatch).
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            # Release (published GitHub release) -> image tag == release tag.
            type=ref,event=tag
            # main only -> timestamp (+ :latest via flavor above).
            type=raw,value={{date 'YYYY.MM.DD.HH.mm'}},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs push too now: the image is deployed to the dev environment for
          # testing before promotion to release. (Build is still gated on the
          # unit + integration test jobs above, so broken images never push.)
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
