name: Build & push geokube image

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - 'geokube/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - 'geokube/**'
      - 'tests/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: the image is built/pushed only if the test suite passes.
  test:
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_REGISTRY }}
          password: ${{ secrets.DOCKER_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve base image digest (reproducible build)
        id: base
        run: |
          ref="${{ vars.DOCKER_REGISTRY }}/geokube-base:latest"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "image=${{ vars.DOCKER_REGISTRY }}/geokube-base@${digest}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/geokube
          # Apply :latest only on main (gates metadata-action's implicit latest=auto,
          # which would otherwise also tag :latest on release-tag builds).
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
          tags: |
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value={{date 'YYYY.MM.DD.HH.mm'}},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Pull requests are build-only validation; everything else is pushed.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
